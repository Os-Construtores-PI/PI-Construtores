name: Upload Obsidian Files Individual

on:
  push:
    paths:
      - 'Assets/Documentação/**'

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Upload Files to Google Drive
        uses: mohammad-fullstack/google-drive-upload-git-action@v1.0.1
        with:
          # O conteúdo do seu JSON em BASE64 (o que você gerou no PowerShell)
          credentials: ${{ secrets.GDRIVE_CREDENTIALS }}
          # ID da pasta do professor
          folderId: ${{ secrets.GDRIVE_FOLDER_ID }}
          # O caminho para a pasta que contém as notas
          # Usamos o curinga '*' para pegar os arquivos dentro dela
          filename: 'Assets/Documentação/**'
          overwrite: "true"
