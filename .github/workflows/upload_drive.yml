name: Sync Obsidian to Drive

on:
  push:
    paths:
      - 'Assets/Documentação/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload Folder to Google Drive
        uses: Tofunmi-faro/google-drive-upload-git-action@v3
        with:
          credentials: ${{ secrets.GDRIVE_CREDENTIALS }}
          folderId: ${{ secrets.GDRIVE_FOLDER_ID }}
          # Aqui indicamos a pasta de origem
          filename: 'Assets/Documentação'
          # Essa opção garante que ele trate como pasta e não como arquivo único
          overwrite: "true"
