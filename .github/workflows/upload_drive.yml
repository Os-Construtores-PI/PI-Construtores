name: Sync Obsidian to Drive

on:
  push:
    paths:
      - 'Assets/Documentação/**'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rclone
        run: sudo apt-get install -y rclone

      - name: Create Rclone Config
        run: |
          mkdir -p ~/.config/rclone
          cat <<EOF > ~/.config/rclone/rclone.conf
          [gdrive]
          type = drive
          service_account_contents = ${{ secrets.GDRIVE_CREDENTIALS_JSON }}
          team_drive = 
          EOF

      - name: Sync Folder to Drive
        run: |
          # rclone sync [origem] [destino:ID_DA_PASTA]
          # O comando sync faz a pasta do Drive ficar IDENTICA à do GitHub
          rclone sync ./Assets/Documentação gdrive:${{ secrets.GDRIVE_FOLDER_ID }} --drive-use-trash
