name: Upload to itch.io

on: 
  push:
    branches:
      - main  # Ajuste para a sua branch principal

jobs:
  itchio-upload:
    runs-on: ubuntu-latest
    steps:
      # 1. Baixa os arquivos do seu repositório para o runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configura o Butler
      - name: Setup butler
        uses: remarkablegames/setup-butler@v2

      # 3. Verifica se o arquivo existe (útil para debug)
      - name: Verify build file
        run: |
          if [ -f "Builds.zip" ]; then
            echo "Arquivo Builds.zip encontrado!"
          else
            echo "ERRO: Builds.zip não encontrado na raiz do repo."
            ls -R # Lista os arquivos para você ver onde ele está
            exit 1
          fi

      # 4. Push para o Itch.io
      - name: Push to Itch.io
        run: butler push "./Builds.zip" construtores/pandora:windows
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
