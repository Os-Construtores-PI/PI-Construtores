name: Build Unity 6 - Windows Build Profiles

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  buildWindowsProfiles:
    name: Build ${{ matrix.profileName }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        include:
          - profileName: WindowsDev
            buildName: windows-dev
            artifactName: Windows-Dev-Build
          - profileName: WindowsProd
            buildName: windows-prod
            artifactName: Windows-Prod-Build

    steps:
      - name: Disk usage
        run: df -h /
    
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      - name: Disk usage
        run: df -h /
          
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Restore Library
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: Library
          key: Library-linux-${{ matrix.profileName }}-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-linux-${{ matrix.profileName }}-

      - name: Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64
          buildProfile: Assets/Settings/BuildProfiles/${{ matrix.profileName }}.asset
          buildName: ${{ matrix.buildName }}
          customImage: breadgamedev/unity-blender:6000.3.12f1-windows-mono

      - name: Save Library
        if: success() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Library
          key: Library-linux-${{ matrix.profileName }}-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifactName }}
          path: build
          retention-days: 7
